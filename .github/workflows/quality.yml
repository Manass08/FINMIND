name: FINMIND quality checks

on:
  push:
    branches: [master, "refactor/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      FINMIND_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/finmind
      JWT_SECRET_KEY: ci-only-not-a-real-secret
      GOOGLE_CLIENT_ID: ci-test-client.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
